name: Maintenance security

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - '.github/workflows/maintenance-security.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: maintenance-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-dependencies:
    name: Runtime and build dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Install the admitted dependency graph
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit runtime and build dependencies
        run: pnpm audit --audit-level low

  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the same runtime image
        run: docker build --tag struinfo:maintenance-scan .
      - name: Check runtime compatibility without network or write access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/tools/runtime_image_smoke.mjs,dst=/runtime-smoke.mjs,readonly" \
            struinfo:maintenance-scan node /runtime-smoke.mjs
      - name: Verify the pinned scanner archive
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Scan the runtime image
        shell: bash
        run: |
          "$RUNNER_TEMP/trivy" image --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --no-progress --timeout 10m struinfo:maintenance-scan
