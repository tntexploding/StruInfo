packages:
  - apps/*
  - packages/*

autoInstallPeers: false
strictPeerDependencies: true
engineStrict: false
saveExact: true
verifyStoreIntegrity: true
trustLockfile: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

blockExoticSubdeps: true
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
strictDepBuilds: true
allowBuilds:
  esbuild@0.28.1: false

# Security repair for GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g.
overrides:
  qs: 6.16.0
  # GHSA-wc9g-mqfw-jrwm, GHSA-qfvm-cv95-jqjf, GHSA-535w-7cp7-47q4, GHSA-qvfw-j98x-7q72.
  multer: 2.3.0
