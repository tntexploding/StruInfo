packages:
  - apps/*
  - packages/*

autoInstallPeers: false
strictPeerDependencies: true
engineStrict: false
saveExact: true
verifyStoreIntegrity: true
trustLockfile: false

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

blockExoticSubdeps: true
ignoredOptionalDependencies:
  - '@napi-rs/canvas'
strictDepBuilds: true
allowBuilds:
  esbuild@0.28.1: false

# Security repair for GHSA-x5fp-wj9c-mxmx and GHSA-4mjr-xmp4-gh2g.
overrides:
  qs: 6.16.1
  # GHSA-wc9g-mqfw-jrwm, GHSA-qfvm-cv95-jqjf, GHSA-535w-7cp7-47q4, GHSA-qvfw-j98x-7q72.
  multer: 2.5.0
  # GHSA-jqcg-44mw-7w3h, GHSA-hrr3-gc8f-f4qj, GHSA-j6r3-76f7-8jcv and GHSA-h3mg-xc3c-68pw.
  proxy-addr: 2.0.8
  fast-uri: 3.1.9
  ip-address: 10.7.4
  # Build/test dependencies: GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7,
  # GHSA-6j4f-fj2g-mc7p and GHSA-68fv-2mgg-jv7q.
  brace-expansion: 5.0.12
  source-map-js: 1.2.2

  # October 28 security reconciliation: MCP/Vite direct pins and constrained parsers.
  zod: 4.6.6
  body-parser: 2.4.0
  hono: 4.13.11
